[package]
name="shrike-dogma"
version="0.1.0"
edition="2024"
publish=false
[workspace]
resolver="3"
members=["vendor/esf-data","vendor/esf-dogma-engine"]
[workspace.package]
version="0.0.0-git"
authors=["EVEShipFit Team <info@eveship.fit>"]
edition="2024"
repository="https://github.com/EVEShipFit/dogma-engine"
license="MIT"
readme="UPSTREAM.md"
keywords=["eve-online","sde","dogma-engine"]
[workspace.dependencies]
esf-data={path="vendor/esf-data",version="0.0.0-git"}
flatbuffers="25.2.10"
serde_json="1"
serde-wasm-bindgen="0.6"
wasm-bindgen="=0.2.128"
serde={version="1",features=["derive"]}
strum="0.28"
strum_macros="0.28"
tsify={version="0.5.8",default-features=false,features=["js"]}
[dependencies]
esf-data={path="vendor/esf-data"}
esf-dogma-engine={path="vendor/esf-dogma-engine"}
serde={version="1",features=["derive"]}
serde_json="1"
wasm-bindgen={version="=0.2.128",optional=true}
serde-wasm-bindgen={version="0.6",optional=true}
console_error_panic_hook={version="0.1",optional=true}
[lib]
crate-type=["cdylib","rlib"]
[features]
browser=["dep:wasm-bindgen","dep:serde-wasm-bindgen","dep:console_error_panic_hook"]
[profile.release]
opt-level=3
[profile.wasm]
inherits="release"
opt-level="s"
lto=true
codegen-units=1
