# Air rebuilds and restarts the Go binary only. `make dev` runs the Nuxt
# development server as a sibling process, so a Go rebuild must not touch it:
# the frontend keeps its state and its hot module replacement connections
# across every restart, and Caddy re-attaches to the same upstream port.
#
# web/ is therefore excluded. Watching it would rebuild Go on every component
# edit, which is both slow and the exact restart the split is meant to avoid.

root = "."
tmp_dir = ".data/air"

[build]
  cmd = "go build -o .data/air/shrike ./cmd/shrike"
  bin = ".data/air/shrike"
  args_bin = ["dev"]
  include_ext = ["go"]
  exclude_dir = [
    ".data",
    ".git",
    ".github",
    "bin",
    "data",
    "docker",
    "docs",
    "migrations",
    "queries",
    "scripts",
    "web",
  ]
  exclude_regex = ["_test\\.go"]
  # Editors write in bursts. Without a delay each save triggers several builds
  # and the port is still held by the previous process when the next one binds.
  delay = 300
  # Caddy needs time to release the listener before the replacement claims it.
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true
