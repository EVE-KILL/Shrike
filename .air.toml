# Air regenerates templates and rebuilds the Go site. The dev reload stream
# refreshes open pages after each restart. Browser sources are compiled by the companion watcher in make dev.

root = "."
tmp_dir = ".data/air"

[build]
  # The script exists to bound the Go build cache, which Air would otherwise
  # grow without limit over a long session. See scripts/air-build.sh.
  cmd = "./scripts/air-build.sh"
  bin = ".data/air/shrike"
  args_bin = ["dev"]
  include_ext = ["go", "templ", "css", "js", "json", "svg", "png", "webp", "avif", "woff2", "ttf"]
  exclude_dir = [
    ".data",
    ".git",
    ".github",
    "bin",
    "data",
    "docker",
    "docs",
    "migrations",
    "queries",
    "scripts",
    "frontend",
    "engine",
  ]
  # The browser builder writes its marker after the complete graph is ready.
  # Watching every chunk starts overlapping Go builds while assets are written.
  exclude_regex = ["_test\\.go", "_templ\\.go", "static/.*\\.js(?:\\.map)?$", "static/utilities\\.css$", "static/lucide-icons\\.json$"]
  # Editors write in bursts. Without a delay each save triggers several builds
  # and the port is still held by the previous process when the next one binds.
  delay = 300
  # Caddy needs time to release the listener before the replacement claims it.
  kill_delay = "2s"
  # The Go service drains on SIGTERM. Air's interrupt left old Caddy listeners
  # alive across rebuilds on macOS, so use the service's normal stop signal.
  send_interrupt = false
  stop_on_error = true

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true
