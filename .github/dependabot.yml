version: 2

# Weekly, not daily: this repository carries a large Go dependency tree, and a
# daily cadence produces more review work than it prevents risk.
#
# Minor and patch updates are grouped into one pull request per ecosystem.
# Majors stay separate, because a major is a decision and deserves its own
# review rather than a place in a list.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go:
        update-types:
          - minor
          - patch

  # Browser tooling and API generation only; engine/WASM pins move together.
  - package-ecosystem: npm
    directories:
      - /frontend
      - /frontend/tools/api-codegen
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      browser:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /engine/dogma
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust:
        update-types:
          - minor
          - patch

  # Base images in the root Dockerfile: Go, Rust and Alpine.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  # Local service images: postgres, valkey, memgraph. A separate ecosystem
  # from `docker`, which reads Dockerfiles only.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  # Reads .github/workflows from the repository root.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        update-types:
          - minor
          - patch
