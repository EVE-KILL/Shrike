name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version tag to create after main CI passes"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_VERSION"
            sha="$GITHUB_SHA"
          else
            tag="$GITHUB_REF_NAME"
            sha="$GITHUB_SHA"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH or a SemVer prerelease."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "Release tags must point to a commit on main."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] &&
             git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag $tag already exists."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Wait for release commit CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            run=$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&event=push&per_page=20" \
                --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0] // {}'
            )
            status=$(jq -r '.status // "missing"' <<< "$run")
            conclusion=$(jq -r '.conclusion // ""' <<< "$run")
            url=$(jq -r '.html_url // ""' <<< "$run")

            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              echo "CI passed: $url"
              exit 0
            fi
            if [[ "$status" == "completed" ]]; then
              echo "CI completed with $conclusion: $url"
              exit 1
            fi

            echo "Waiting for CI on $RELEASE_SHA (status: $status, attempt: $attempt/120)"
            sleep 15
          done

          echo "Timed out waiting for CI on $RELEASE_SHA."
          exit 1

      - name: Create requested release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_pair: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_pair: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: |
            type=gha,scope=shrike-release-${{ matrix.platform_pair }}
            type=gha,scope=shrike-ci
          cache-to: type=gha,mode=max,scope=shrike-release-${{ matrix.platform_pair }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.validate.outputs.tag }}
            COMMIT=${{ needs.validate.outputs.sha }}

      - name: Export image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish unified image
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.tag }}
            type=semver,value=${{ needs.validate.outputs.tag }},pattern={{version}}
            type=semver,value=${{ needs.validate.outputs.tag }},pattern={{major}}.{{minor}}
            type=semver,value=${{ needs.validate.outputs.tag }},pattern={{major}}
            type=raw,value=sha-${{ needs.validate.outputs.sha }}
            type=raw,value=latest,enable=${{ !contains(needs.validate.outputs.tag, '-') }}

      - name: Create and publish manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          mapfile -t digests < <(printf '%s\n' *)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digests[@]}."
            exit 1
          fi
          mapfile -t tags < <(jq -r '.tags[]' <<< "$IMAGE_TAGS_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done
          image_refs=()
          for digest in "${digests[@]}"; do
            image_refs+=("$IMAGE_NAME@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${image_refs[@]}"
          digest=$(docker buildx imagetools inspect \
            "$IMAGE_NAME:${{ needs.validate.outputs.tag }}" \
            --format '{{json .Manifest.Digest}}' | jq -r .)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Write release summary
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "## Shrike image"
            echo
            echo "- Tag: \`${{ needs.validate.outputs.tag }}\`"
            echo "- Commit: \`${{ needs.validate.outputs.sha }}\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo
            echo "This workflow did not deploy the image."
          } >> "$GITHUB_STEP_SUMMARY"
