name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH or a SemVer prerelease."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main."
            exit 1
          fi

      - name: Verify tagged commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          successful_runs=$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
          )
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "The tagged commit does not have a successful main CI run."
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_pair: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_pair: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: |
            type=gha,scope=shrike-release-${{ matrix.platform_pair }}
            type=gha,scope=shrike-ci
          cache-to: type=gha,mode=max,scope=shrike-release-${{ matrix.platform_pair }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Export image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish unified image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create and publish manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          mapfile -t digests < <(printf '%s\n' *)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digests[@]}."
            exit 1
          fi
          mapfile -t tags < <(jq -r '.tags[]' <<< "$IMAGE_TAGS_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done
          image_refs=()
          for digest in "${digests[@]}"; do
            image_refs+=("$IMAGE_NAME@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${image_refs[@]}"
          digest=$(docker buildx imagetools inspect \
            "$IMAGE_NAME:${{ steps.metadata.outputs.version }}" \
            --format '{{json .Manifest.Digest}}' | jq -r .)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Write release summary
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "## Shrike image"
            echo
            echo "- Tag: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo
            echo "This workflow did not deploy the image."
          } >> "$GITHUB_STEP_SUMMARY"
