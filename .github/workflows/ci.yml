name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.27.0
  BUN_VERSION: 1.4.0
  TEST_DATABASE_URL: postgresql://shrike_ci:shrike_ci@127.0.0.1:5432/shrike_ci
  TEST_REDIS_ADDR: 127.0.0.1:6379

jobs:
  go-quality:
    name: Go formatting, lint, vet, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint on new issues
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: >-
            --new-from-rev=${{
              github.event_name == 'pull_request'
              && format('origin/{0}', github.base_ref)
              || github.event.before
            }}
            --timeout=5m

      - name: Run Go vet
        run: go vet ./...

      - name: Compile Go commands
        run: go build ./...

  go-generated:
    name: Go generated code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install API generator modules
        run: bun install --cwd web/tools/api-codegen --frozen-lockfile

      - name: Check generated API contract
        run: make check-api-client

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Check generated sqlc code
        run: |
          sqlc generate
          if ! git diff --quiet -- internal/dbgen; then
            echo "sqlc-generated code is out of date."
            echo "Run 'sqlc generate' locally and commit the result."
            git diff --stat -- internal/dbgen
            exit 1
          fi

  go-race:
    name: Go race tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane:
          - shard-0
          - shard-1
          - api

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: shrike_ci
          POSTGRES_PASSWORD: shrike_ci
          POSTGRES_DB: shrike_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shrike_ci -d shrike_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Create application schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: go run ./cmd/shrike db:migrate --apply

      - name: Create River schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: go run ./cmd/shrike queue:migrate

      - name: Run Go tests with race detector
        env:
          LANE: ${{ matrix.lane }}
          SHARD_COUNT: 2
        shell: bash
        run: |
          if [[ "$LANE" == "api" ]]; then
            packages=("github.com/eve-kill/shrike/internal/api")
          else
            shard="${LANE#shard-}"
            mapfile -t packages < <(
              go list ./... |
                awk '$0 != "github.com/eve-kill/shrike/internal/api"' |
                awk -v shard="$shard" -v count="$SHARD_COUNT" \
                  '(NR - 1) % count == shard'
            )
          fi
          printf 'Testing %d packages in %s\n' "${#packages[@]}" "$LANE"
          go test -race -count=1 "${packages[@]}"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Guard against trusted dependencies
        run: |
          if grep -q '"trustedDependencies"' web/package.json; then
            echo "web/package.json introduces trustedDependencies."
            echo "This permits dependency lifecycle scripts and requires explicit review."
            exit 1
          fi

      - name: Install frontend modules
        run: bun install --cwd web --frozen-lockfile

      - name: Run frontend tests
        run: bun run --cwd web test

      - name: Type-check frontend
        run: bun run --cwd web typecheck

      - name: Audit frontend dependencies
        continue-on-error: true
        run: bun audit --cwd web

  security:
    name: Security (govulncheck and OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache govulncheck
        uses: actions/cache@v6
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ runner.os }}-go${{ env.GO_VERSION }}-v1

      - name: Check reachable Go vulnerabilities
        run: |
          if [ ! -x "$HOME/go/bin/govulncheck" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          fi
          "$HOME/go/bin/govulncheck" ./...

      - name: Scan Go and frontend dependencies with OSV
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            ./

  verify:
    name: Verify source checks
    if: ${{ always() }}
    needs:
      - go-quality
      - go-generated
      - go-race
      - frontend
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI lane
        env:
          GO_QUALITY_RESULT: ${{ needs.go-quality.result }}
          GO_GENERATED_RESULT: ${{ needs.go-generated.result }}
          GO_RACE_RESULT: ${{ needs.go-race.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        shell: bash
        run: |
          if [[ "$GO_QUALITY_RESULT" != "success" ||
                "$GO_GENERATED_RESULT" != "success" ||
                "$GO_RACE_RESULT" != "success" ||
                "$FRONTEND_RESULT" != "success" ||
                "$SECURITY_RESULT" != "success" ]]; then
            echo "Go quality: $GO_QUALITY_RESULT"
            echo "Go generated: $GO_GENERATED_RESULT"
            echo "Go race: $GO_RACE_RESULT"
            echo "Frontend: $FRONTEND_RESULT"
            echo "Security: $SECURITY_RESULT"
            exit 1
          fi
