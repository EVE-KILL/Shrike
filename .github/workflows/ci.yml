name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.5
  BUN_VERSION: 1.3.14
  TEST_DATABASE_URL: postgresql://shrike_ci:shrike_ci@127.0.0.1:5432/shrike_ci
  TEST_REDIS_ADDR: 127.0.0.1:6379

jobs:
  go:
    name: Go and schemas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: shrike_ci
          POSTGRES_PASSWORD: shrike_ci
          POSTGRES_DB: shrike_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shrike_ci -d shrike_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download Go modules
        run: go mod download

      - name: Install API generator modules
        run: bun install --cwd web/tools/api-codegen --frozen-lockfile

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check generated API contract
        run: make check-api-client

      - name: Run Go vet
        run: go vet ./...

      - name: Create application schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: go run ./cmd/shrike db:migrate --apply

      - name: Create River schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: go run ./cmd/shrike queue:migrate

      - name: Run Go tests
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend modules
        run: bun install --cwd web --frozen-lockfile

      - name: Run frontend tests
        run: bun run --cwd web test

      - name: Type-check frontend
        run: bun run --cwd web typecheck

  image:
    name: Unified image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build unified container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: shrike:ci
          cache-from: type=gha,scope=shrike-ci
          cache-to: type=gha,mode=max,scope=shrike-ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}

      - name: Smoke-test unified container
        run: docker run --rm shrike:ci version

  verify:
    name: Verify source and unified image
    if: ${{ always() }}
    needs:
      - go
      - frontend
      - image
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI lane
        env:
          GO_RESULT: ${{ needs.go.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        shell: bash
        run: |
          if [[ "$GO_RESULT" != "success" ||
                "$FRONTEND_RESULT" != "success" ||
                "$IMAGE_RESULT" != "success" ]]; then
            echo "Go: $GO_RESULT"
            echo "Frontend: $FRONTEND_RESULT"
            echo "Image: $IMAGE_RESULT"
            exit 1
          fi
