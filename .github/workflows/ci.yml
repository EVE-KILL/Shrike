name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.27.0
  NODE_VERSION: 24
  RUST_VERSION: 1.99.0
  TEST_DATABASE_URL: postgresql://shrike_ci:shrike_ci@127.0.0.1:5432/shrike_ci
  TEST_REDIS_ADDR: 127.0.0.1:6379

jobs:
  go-quality:
    name: Go formatting, lint, vet, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check frontend template formatting and generation
        run: |
          go tool templ fmt -fail internal/frontend
          go tool templ generate -path internal/frontend
          git diff --exit-code -- internal/frontend

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint on new issues
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: >-
            --new-from-rev=${{
              github.event_name == 'pull_request'
              && format('origin/{0}', github.base_ref)
              || github.event.before
            }}
            --timeout=5m

      - name: Run Go vet
        run: go vet ./...

      - name: Compile Go commands
        run: go build ./...

  go-generated:
    name: Go generated code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install API generator modules
        run: npm --prefix frontend/tools/api-codegen ci --ignore-scripts

      - name: Check generated API contract
        run: make check-api-client

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Check generated sqlc code
        run: |
          sqlc generate
          if ! git diff --quiet -- internal/dbgen; then
            echo "sqlc-generated code is out of date."
            echo "Run 'sqlc generate' locally and commit the result."
            git diff --stat -- internal/dbgen
            exit 1
          fi

  go-race:
    name: Go race tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane:
          - shard-0
          - shard-1
          - api

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: shrike_ci
          POSTGRES_PASSWORD: shrike_ci
          POSTGRES_DB: shrike_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shrike_ci -d shrike_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create application schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: go run ./cmd/shrike db:migrate --apply

      - name: Create River schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: go run ./cmd/shrike queue:migrate

      - name: Run Go tests with race detector
        env:
          LANE: ${{ matrix.lane }}
          SHARD_COUNT: 2
        shell: bash
        run: |
          if [[ "$LANE" == "api" ]]; then
            packages=("github.com/eve-kill/shrike/internal/api")
          else
            shard="${LANE#shard-}"
            mapfile -t packages < <(
              go list ./... |
                awk '$0 != "github.com/eve-kill/shrike/internal/api"' |
                awk -v shard="$shard" -v count="$SHARD_COUNT" \
                  '(NR - 1) % count == shard'
            )
          fi
          printf 'Testing %d packages in %s\n' "${#packages[@]}" "$LANE"
          go test -race -count=1 "${packages[@]}"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser build modules
        run: npm --prefix frontend ci --ignore-scripts

      - name: Run browser interaction and WASM tests
        run: npm --prefix frontend test

      - name: Type-check browser code
        run: npm --prefix frontend run typecheck

      - name: Verify reproducible browser bundles
        run: |
          npm --prefix frontend run build
          git diff --exit-code -- internal/frontend/static internal/frontend/data frontend/browser-artifacts.json

      - name: Audit browser dependencies
        run: npm --prefix frontend audit --omit=dev

  native-engine:
    name: Native fitting engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check worker formatting
        run: cargo fmt --manifest-path engine/dogma/Cargo.toml -p shrike-dogma --check
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify committed WASM matches its source
        run: node frontend/scripts/dogma-source.mjs --check
      - name: Build pinned native worker
        run: make build-dogma
      - name: Validate protocol, cancellation and calculation parity
        run: go test -race -count=1 ./internal/dogma
      - name: Install browser engine test tooling
        run: npm --prefix frontend ci --ignore-scripts
      - name: Verify native and browser calculations match
        env:
          DOGMA_REQUIRE_NATIVE: 1
        run: npm --prefix frontend test -- dogma/test/native-parity.test.ts


  security:
    name: Security (govulncheck and OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache govulncheck
        uses: actions/cache@v6
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ runner.os }}-go${{ env.GO_VERSION }}-v1

      - name: Check reachable Go vulnerabilities
        run: |
          if [ ! -x "$HOME/go/bin/govulncheck" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          fi
          "$HOME/go/bin/govulncheck" ./...

      - name: Scan Go and frontend dependencies with OSV
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            ./

  verify:
    name: Verify source checks
    if: ${{ always() }}
    needs:
      - go-quality
      - go-generated
      - go-race
      - frontend
      - native-engine
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI lane
        env:
          GO_QUALITY_RESULT: ${{ needs.go-quality.result }}
          GO_GENERATED_RESULT: ${{ needs.go-generated.result }}
          GO_RACE_RESULT: ${{ needs.go-race.result }}
          NATIVE_ENGINE_RESULT: ${{ needs.native-engine.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        shell: bash
        run: |
          if [[ "$GO_QUALITY_RESULT" != "success" ||
                "$GO_GENERATED_RESULT" != "success" ||
                "$GO_RACE_RESULT" != "success" ||
                "$NATIVE_ENGINE_RESULT" != "success" ||
                "$FRONTEND_RESULT" != "success" ||
                "$SECURITY_RESULT" != "success" ]]; then
            echo "Go quality: $GO_QUALITY_RESULT"
            echo "Go generated: $GO_GENERATED_RESULT"
            echo "Go race: $GO_RACE_RESULT"
            echo "Frontend: $FRONTEND_RESULT"
            echo "Native engine: $NATIVE_ENGINE_RESULT"
            echo "Security: $SECURITY_RESULT"
            exit 1
          fi
