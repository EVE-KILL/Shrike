version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - unconvert
    - gocritic
  settings:
    gosec:
      # G104 overlaps with errcheck. G115 is noisy around deliberate database
      # integer-width conversions and is better reviewed at the call site.
      excludes:
        - G104
        - G115
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    rules:
      # sqlc output is generated and reviewed through the drift check.
      - path: internal/dbgen/
        linters:
          - errcheck
          - govet
          - ineffassign
          - staticcheck
          - unused
          - gosec
          - misspell
          - unconvert
          - gocritic
      # Preserve the pinned third-party converter instead of carrying style
      # patches. Its public data files use upstream permissions and filenames;
      # taint/security checks outside these reviewed findings remain enabled.
      - path: internal/dogmadata/upstream/
        linters:
          - errcheck
          - gocritic
          - staticcheck
          - unused
      - path: internal/dogmadata/upstream/
        text: 'G(301|302|304|306):'
        linters:
          - gosec
      # Tests get more leeway around cleanup paths and deliberately malformed
      # security inputs.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
