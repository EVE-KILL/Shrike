# Git hooks for Shrike. Install with `make hooks` (or `lefthook install`).
#
# pre-commit is scoped to staged files and stays fast, so it is not tempting to
# skip. pre-push runs the whole suite, because that is the last point where a
# mistake is still cheap to fix.
#
# Tests that need Postgres create throwaway databases on the local docker stack
# and skip themselves when it is unreachable, so hooks work with docker down.

pre-commit:
  parallel: true
  jobs:
    # Runs first and is deliberately not parallel-safe to skip: this is the one
    # check whose failure is unrecoverable once pushed.
    - name: secrets
      run: ./scripts/check-secrets.sh

    # Bun blocks dependency lifecycle scripts unless a package is explicitly
    # trusted. Adding this escape hatch must be a deliberate policy change.
    - name: bun trusted dependencies
      glob: "web/package.json"
      run: |
        if grep -q '"trustedDependencies"' web/package.json; then
          echo "web/package.json introduces trustedDependencies." >&2
          echo "Remove it or intentionally update this guard after review." >&2
          exit 1
        fi

    - name: gofmt
      glob: "*.go"
      # stage_fixed re-stages what gofmt rewrites, so formatting never fails a
      # commit — it fixes it and carries on.
      run: gofmt -w {staged_files}
      stage_fixed: true

    - name: go vet
      glob: "*.go"
      run: go vet ./...

    # The repository has an existing lint baseline. Reject only findings
    # introduced by the staged change until that baseline has been retired.
    - name: golangci lint
      glob: "*.go"
      run: golangci-lint run --new-from-rev=HEAD --timeout=5m ./...

    - name: build
      glob:
        - "*.go"
        - "go.mod"
        - "go.sum"
      run: go build ./...

    - name: tests
      glob:
        - "*.go"
        - "migrations/*.sql"
      run: go test ./...

    # Frontend unit tests and type checking run before a web change can be
    # committed. CI repeats them because hooks can be bypassed or absent.
    - name: frontend
      glob:
        - "web/**/*.{ts,vue,js,mjs}"
        - "web/package.json"
        - "web/bun.lock"
      run: |
        bun run --cwd web test
        bun run --cwd web typecheck

    # The Nuxt renderer imports the generated Huma contract directly. Any API
    # registration or schema change must therefore regenerate and stage both
    # the OpenAPI document and its TypeScript types in the same commit.
    - name: openapi contract up to date
      glob:
        - "internal/api/*.go"
        - "internal/cli/openapi.go"
        - "web/tools/api-codegen/*"
      run: |
        make gen-api-client >/dev/null
        if ! git diff --quiet -- web/shared/api.openapi.json web/shared/api/; then
          echo "OpenAPI spec or generated TypeScript contract is stale." >&2
          echo "Run 'make gen-api-client' and stage the generated files." >&2
          git diff --stat -- web/shared/api.openapi.json web/shared/api/ >&2
          exit 1
        fi

    # sqlc generates internal/dbgen from migrations/. If a migration lands
    # without regenerating, the structs silently describe a schema that no
    # longer exists — the failure then shows up as a scan error at runtime.
    - name: sqlc up to date
      glob:
        - "migrations/*.sql"
        - "queries/*.sql"
        - "sqlc.yaml"
      run: |
        sqlc generate
        if ! git diff --quiet -- internal/dbgen; then
          echo "internal/dbgen is stale — sqlc generate produced changes."
          echo "Stage them:  git add internal/dbgen"
          exit 1
        fi

pre-push:
  parallel: false
  jobs:
    - name: secrets
      run: ./scripts/check-secrets.sh

    - name: formatting
      # A hard failure here rather than a rewrite: by push time, unformatted
      # code means something bypassed the pre-commit hook.
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt'd:"; echo "$unformatted" | sed 's/^/    /'
          exit 1
        fi

    - name: go vet
      run: go vet ./...

    - name: tests
      run: go test ./...

    # Production runs linux; catching a build failure here beats catching it in
    # CI after the push.
    - name: cross-compile
      run: GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/shrike
